name: Production Build

on:
  workflow_dispatch:
    inputs:
      live_backup_tests:
        description: Run the real-server backup and restore smoke suite
        type: boolean
        default: false
      startup_measurements:
        description: Measure startup and first navigation in a dedicated job
        type: boolean
        default: false
      startup_baseline_run:
        description: Previous production build run ID for an interleaved comparison
        type: string
        default: ''
      startup_rounds:
        description: Sequential samples per build (1 to 9)
        type: string
        default: '5'
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated locale definitions and assets
        run: bun run check:locales

      - name: Generate font assets
        run: bun run gen:font

      - name: Build production application
        run: bun run build:prod

      - name: Upload production application
        uses: actions/upload-artifact@v7
        with:
          name: production-browser
          path: dist/ngclient/browser
          retention-days: 1
          if-no-files-found: error

      - name: Generate package metadata
        run: bun run gen:package-json

      - name: Check npm package contents without publishing
        working-directory: ./dist/ngclient/browser
        run: npm pack --dry-run

  browser-tests:
    needs: production-build
    runs-on: ubuntu-latest
    # The budget includes Chromium's system dependency installation on a fresh runner.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download production application
        uses: actions/download-artifact@v8
        with:
          name: production-browser
          path: dist/ngclient/browser

      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Check browser test types
        run: bunx tsc --project e2e/tsconfig.json

      - name: Test production application in Chromium
        run: bun run test:e2e

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          retention-days: 7

  live-browser-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.live_backup_tests
    needs: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: production-browser
          path: dist/ngclient/browser
      - run: bunx playwright install --with-deps --only-shell chromium

      - name: Download and verify Duplicati
        env:
          DUPLICATI_VERSION: 2.4.1.101_canary_2026-11-07
          DUPLICATI_SHA256: 2fe174fadd3fe41f05cc6179ab890f68ee83c4bb09b6b57a432a662374699686
        run: |
          set -euo pipefail
          archive="duplicati-${DUPLICATI_VERSION}-linux-x64-gui.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/duplicati/duplicati/releases/download/v${DUPLICATI_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$DUPLICATI_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/duplicati"
          server="$(find "$RUNNER_TEMP/duplicati" -type f -name duplicati-server -print -quit)"
          test -n "$server"
          test -x "$server"
          echo "DUPLICATI_SERVER_PATH=$server" >> "$GITHUB_ENV"

      - name: Test backup creation, execution, restore and deletion
        env:
          PLAYWRIGHT_MODE: live
        run: bun run test:e2e backup-restore.spec.ts delete-backup.spec.ts

      - name: Upload live browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-playwright-diagnostics
          path: |
            playwright-report
            test-results/**/*.zip
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/error-context.md
            test-results/live-server-*/server.log
          retention-days: 7

  startup-measurements:
    if: github.event_name == 'workflow_dispatch' && inputs.startup_measurements
    needs: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps --only-shell chromium
      - name: Download candidate production build
        uses: actions/download-artifact@v8
        with:
          name: production-browser
          path: tmp/startup-candidate
      - name: Download baseline production build
        uses: actions/download-artifact@v8
        with:
          name: production-browser
          path: tmp/startup-baseline
          run-id: ${{ inputs.startup_baseline_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Measure isolated production startup and navigation
        run: bun run measure:startup
        env:
          STARTUP_BASELINE_DIR: ${{ github.workspace }}/tmp/startup-baseline
          STARTUP_CANDIDATE_DIR: ${{ github.workspace }}/tmp/startup-candidate
          STARTUP_RESULTS_DIR: tmp/startup-measurements
          STARTUP_VARIANTS: ${{ inputs.startup_baseline_run && 'baseline,candidate' || 'baseline' }}
          STARTUP_ROUNDS: ${{ inputs.startup_rounds }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-measurements
          path: tmp/startup-measurements
          retention-days: 14
