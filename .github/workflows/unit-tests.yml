name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated locale definitions and assets
        run: bun run check:locales

      - name: Test locale catalog contracts
        run: bun run test:locales

      - name: Check build script ordering and failure handling
        run: bun run test:build

      - name: Run unit tests
        run: bun run test:ci
