<header>
  <h3 class="title-30" i18n>File attributes</h3>
</header>

<section content>
  <p i18n>Files and folders with any of the selected attributes are excluded from the backup.</p>

  <div class="options">
    @for (option of options(); track option) {
      <sh-checkbox class="primary raised">
        {{ option }}
        <input type="checkbox" [formField]="selectionForm[option.toLowerCase()]!" />
      </sh-checkbox>
    }
  </div>
</section>

<footer footer class="sticky">
  <button shButton type="button" (click)="closed.emit(null)" i18n>Cancel</button>
  <button shButton type="button" class="raised primary" (click)="submit()" i18n>OK</button>
</footer>
