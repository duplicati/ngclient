@if (customLogo()) {
  <div class="custom-logo-container">
    <img [src]="customLogo()" alt="Logo" class="logo-image" />
    @if (customName()) {
      <div>
        <div class="logo-text">{{ customName() }}</div>
        <div class="logo-subtext">- powered by Duplicati</div>
      </div>
    } @else {
      <div class="logo-text">Duplicati</div>
    }
  </div>
} @else {
  <img src="assets/duplicati/app-icon.png" alt="Duplicati" />
  <h2>duplicati</h2>
}
