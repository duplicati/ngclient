<ng-content select="label" ngProjectAs="label" />

<sh-form-field [attr.readonly]="readonly() || undefined">
  <input type="number" [id]="customId()" [formField]="durationForm.amount" />

  <ng-content select="[prefix]" />
  <ng-content select="[suffix]" />
</sh-form-field>

<sh-menu [openIndicator]="true">
  <button shButton class="trigger" type="button" i18n>{{ unitLabel() }}</button>

  <ng-container menu>
    @for (option of timeOptions(); track $index) {
      <button shButton type="button" class="small" (click)="updateUnit(option.value)" i18n>{{ option.label }}</button>
    }
  </ng-container>
</sh-menu>
