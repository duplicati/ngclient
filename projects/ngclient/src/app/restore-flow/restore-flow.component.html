<app-status-bar />

@if (!isFullWidthPage()) {
  <nav class="backup-stepper" aria-label="Restore steps" i18n-aria-label>
    @if (isFileRestore()) {
      <a routerLinkActive="active" ariaCurrentWhenActive="step" [routerLink]="['/restore-from-files/destination']" i18n>
        Destination
      </a>
      <a routerLinkActive="active" ariaCurrentWhenActive="step" [routerLink]="['/restore-from-files/encryption']" i18n>
        Encryption
      </a>
      <a
        routerLinkActive="active"
        ariaCurrentWhenActive="step"
        class="inactive"
        [routerLink]="['/restore-from-files/select-files']"
        i18n>
        Select files
      </a>
      <a
        routerLinkActive="active"
        ariaCurrentWhenActive="step"
        class="inactive"
        [routerLink]="['/restore-from-files/options']"
        i18n>
        Options
      </a>
    } @else {
      <a
        routerLinkActive="active"
        ariaCurrentWhenActive="step"
        [routerLink]="['/restore', backupId(), 'select-files']"
        i18n>
        Select files
      </a>
      <a routerLinkActive="active" ariaCurrentWhenActive="step" [routerLink]="['/restore', backupId(), 'options']" i18n>
        Options
      </a>
    }
  </nav>
}

<section>
  <router-outlet />
</section>
